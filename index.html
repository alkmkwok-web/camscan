<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Targeted OCR - Auto & Manual Capture</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 15px; text-align: center; background: #121212; color: #fff; }
    
    .scanner-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
    }

    video { width: 100%; display: block; }

    /* Target overlay turns green when still */
    .target-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 75%;
      height: 20%;
      transform: translate(-50%, -50%);
      border: 3px solid #ff4444;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
      border-radius: 6px;
      pointer-events: none;
      transition: border-color 0.2s ease;
    }

    .target-overlay.stable {
      border-color: #00ffcc;
    }

    /* Manual Scan Button */
    .btn-container { margin-top: 15px; }
    button {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      background: #00ffcc;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status { margin-top: 15px; color: #aaa; font-size: 0.9rem; }
    #result { margin-top: 10px; font-weight: bold; font-size: 1.3rem; color: #00ffcc; }
  </style>
</head>
<body>

  <h2>Targeted OCR Scanner</h2>

  <div class="scanner-container">
    <video id="webcam" autoplay playsinline></video>
    <div id="targetBox" class="target-overlay"></div>
  </div>

  <div class="btn-container">
    <button id="manualScanBtn">Manual Scan</button>
  </div>

  <div id="status">Align text in box (Auto-scans when still or tap button)</div>
  <div id="result">Result: None</div>

  <canvas id="cropCanvas" style="display:none;"></canvas>
  <canvas id="motionCanvas" style="display:none;" width="64" height="32"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const targetBox = document.getElementById('targetBox');
    const manualScanBtn = document.getElementById('manualScanBtn');
    const cropCanvas = document.getElementById('cropCanvas');
    const motionCanvas = document.getElementById('motionCanvas');
    const motionCtx = motionCanvas.getContext('2d', { willReadFrequently: true });
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');

    let prevFrameData = null;
    let stillStartTime = null;
    let isProcessing = false;
    let scanCooldown = false;

    const MOTION_THRESHOLD = 8.0;   
    const STILL_DURATION_MS = 600;  

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => setInterval(checkMotion, 100);
      } catch (err) {
        const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = fallbackStream;
        video.onloadedmetadata = () => setInterval(checkMotion, 100);
      }
    }

    // Auto-capture motion check
    function checkMotion() {
      if (isProcessing || scanCooldown || !video.videoWidth) return;

      const cropCoords = getCropCoordinates();
      motionCtx.drawImage(video, cropCoords.x, cropCoords.y, cropCoords.w, cropCoords.h, 0, 0, 64, 32);
      const currentFrame = motionCtx.getImageData(0, 0, 64, 32);

      if (prevFrameData) {
        const diff = calculateFrameDiff(prevFrameData.data, currentFrame.data);

        if (diff < MOTION_THRESHOLD) {
          if (!stillStartTime) stillStartTime = Date.now();
          targetBox.classList.add('stable');
          
          if (Date.now() - stillStartTime >= STILL_DURATION_MS) {
            captureAndScan("Auto");
          }
        } else {
          stillStartTime = null;
          targetBox.classList.remove('stable');
        }
      }

      prevFrameData = currentFrame;
    }

    function calculateFrameDiff(data1, data2) {
      let totalDiff = 0;
      for (let i = 0; i < data1.length; i += 4) {
        totalDiff += Math.abs(data1[i] - data2[i]);
        totalDiff += Math.abs(data1[i+1] - data2[i+1]);
        totalDiff += Math.abs(data1[i+2] - data2[i+2]);
      }
      return totalDiff / (data1.length / 4);
    }

    function getCropCoordinates() {
      const scaleX = video.videoWidth / video.clientWidth;
      const scaleY = video.videoHeight / video.clientHeight;
      const targetRect = targetBox.getBoundingClientRect();
      const videoRect = video.getBoundingClientRect();

      return {
        x: (targetRect.left - videoRect.left) * scaleX,
        y: (targetRect.top - videoRect.top) * scaleY,
        w: targetRect.width * scaleX,
        h: targetRect.height * scaleY
      };
    }

    // Shared execution trigger (Works for both Manual Button & Auto-capture)
    async function captureAndScan(source = "Manual") {
      if (isProcessing || scanCooldown) return;

      isProcessing = true;
      manualScanBtn.disabled = true;
      statusDiv.innerText = `Scanning (${source})...`;

      const coords = getCropCoordinates();
      cropCanvas.width = coords.w;
      cropCanvas.height = coords.h;
      
      const ctx = cropCanvas.getContext('2d');
      ctx.drawImage(video, coords.x, coords.y, coords.w, coords.h, 0, 0, coords.w, coords.h);

      try {
        const worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ/#-',
        });

        const { data: { text } } = await worker.recognize(cropCanvas);
        resultDiv.innerText = "Detected: " + (text.trim() || "No text found");
        statusDiv.innerText = "Scan complete!";

        await worker.terminate();
      } catch (err) {
        console.error(err);
        statusDiv.innerText = "OCR scan failed.";
      }

      // Cooldown before next scan allowed
      scanCooldown = true;
      setTimeout(() => {
        scanCooldown = false;
        isProcessing = false;
        stillStartTime = null;
        manualScanBtn.disabled = false;
        targetBox.classList.remove('stable');
        statusDiv.innerText = "Ready to scan (Hold still or tap button)";
      }, 2000);
    }

    // Event listener for manual scan
    manualScanBtn.addEventListener('click', () => captureAndScan("Manual"));

    startCamera();
  </script>
</body>
</html>
