<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Capture Targeted OCR</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 15px; text-align: center; background: #121212; color: #fff; }
    
    .scanner-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
    }

    video { width: 100%; display: block; }

    /* Target overlay changes color when device becomes still */
    .target-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 75%;
      height: 20%;
      transform: translate(-50%, -50%);
      border: 3px solid #ff4444; /* Default: Moving / Waiting */
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
      border-radius: 6px;
      pointer-events: none;
      transition: border-color 0.2s ease;
    }

    .target-overlay.stable {
      border-color: #00ffcc; /* Still / Ready to scan */
    }

    #status { margin-top: 15px; color: #aaa; font-size: 0.9rem; }
    #result { margin-top: 10px; font-weight: bold; font-size: 1.3rem; color: #00ffcc; }
  </style>
</head>
<body>

  <h2>Auto-Capture Scanner</h2>

  <div class="scanner-container">
    <video id="webcam" autoplay playsinline></video>
    <div id="targetBox" class="target-overlay"></div>
  </div>

  <div id="status">Hold device still over text...</div>
  <div id="result">Result: None</div>

  <!-- Hidden canvases for OCR crop and low-res motion analysis -->
  <canvas id="cropCanvas" style="display:none;"></canvas>
  <canvas id="motionCanvas" style="display:none;" width="64" height="32"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const targetBox = document.getElementById('targetBox');
    const cropCanvas = document.getElementById('cropCanvas');
    const motionCanvas = document.getElementById('motionCanvas');
    const motionCtx = motionCanvas.getContext('2d', { willReadFrequently: true });
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');

    let prevFrameData = null;
    let stillStartTime = null;
    let isProcessing = false;
    let scanCooldown = false;

    // Configuration thresholds
    const MOTION_THRESHOLD = 8.0;   // Max average pixel delta to consider "still"
    const STILL_DURATION_MS = 500;  // How long camera must stay still before capture

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          setInterval(checkMotion, 100); // Sample motion 10 times per second
        };
      } catch (err) {
        const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = fallbackStream;
        video.onloadedmetadata = () => setInterval(checkMotion, 100);
      }
    }

    function checkMotion() {
      if (isProcessing || scanCooldown || !video.videoWidth) return;

      const scaleX = video.videoWidth / video.clientWidth;
      const scaleY = video.videoHeight / video.clientHeight;
      const targetRect = targetBox.getBoundingClientRect();
      const videoRect = video.getBoundingClientRect();

      const cropX = (targetRect.left - videoRect.left) * scaleX;
      const cropY = (targetRect.top - videoRect.top) * scaleY;
      const cropWidth = targetRect.width * scaleX;
      const cropHeight = targetRect.height * scaleY;

      // Draw downscaled low-res sample of target area to measure frame differences cheaply
      motionCtx.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, 64, 32);
      const currentFrame = motionCtx.getImageData(0, 0, 64, 32);

      if (prevFrameData) {
        const diff = calculateFrameDiff(prevFrameData.data, currentFrame.data);

        if (diff < MOTION_THRESHOLD) {
          // Camera is currently holding still
          if (!stillStartTime) stillStartTime = Date.now();
          targetBox.classList.add('stable');
          
          // Trigger scan if still duration exceeds set threshold
          if (Date.now() - stillStartTime >= STILL_DURATION_MS) {
            triggerAutoScan(cropX, cropY, cropWidth, cropHeight);
          }
        } else {
          // Camera moved — reset stability timer
          stillStartTime = null;
          targetBox.classList.remove('stable');
          statusDiv.innerText = "Hold device still over target...";
        }
      }

      prevFrameData = currentFrame;
    }

    function calculateFrameDiff(data1, data2) {
      let totalDiff = 0;
      // Sample RGB values across pixels
      for (let i = 0; i < data1.length; i += 4) {
        totalDiff += Math.abs(data1[i] - data2[i]);         // Red channel
        totalDiff += Math.abs(data1[i+1] - data2[i+1]);     // Green channel
        totalDiff += Math.abs(data1[i+2] - data2[i+2]);     // Blue channel
      }
      return totalDiff / (data1.length / 4);
    }

    async function triggerAutoScan(cropX, cropY, cropWidth, cropHeight) {
      isProcessing = true;
      statusDiv.innerText = "Capturing & scanning...";

      // Draw full resolution cropped frame to OCR canvas
      cropCanvas.width = cropWidth;
      cropCanvas.height = cropHeight;
      const ctx = cropCanvas.getContext('2d');
      ctx.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

      try {
        const worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ/#-',
        });

        const { data: { text } } = await worker.recognize(cropCanvas);
        resultDiv.innerText = "Detected: " + (text.trim() || "No text found");
        statusDiv.innerText = "Scan complete!";

        await worker.terminate();
      } catch (err) {
        console.error(err);
        statusDiv.innerText = "OCR scan failed.";
      }

      // Add a brief cooldown period to prevent rapid repeated scans
      scanCooldown = true;
      setTimeout(() => {
        scanCooldown = false;
        isProcessing = false;
        stillStartTime = null;
        targetBox.classList.remove('stable');
        statusDiv.innerText = "Hold device still over text...";
      }, 2500);
    }

    startCamera();
  </script>
</body>
</html>
